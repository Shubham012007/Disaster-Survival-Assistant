<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Preparedness Checklist</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand" href="/">
                🚨 Disaster Survival Assistant
            </a>

            <a href="/" class="btn btn-outline-light">
                Home
            </a>

        </div>
    </nav>


    <!-- ================= MAIN ================= -->

    <div class="container mt-5">

        <div class="text-center">

            <h1>
                ✅ Emergency Preparedness Checklist
            </h1>

            <p class="lead">
                Check your emergency supplies before a disaster.
            </p>

        </div>


        <!-- ================= CHECKLIST ================= -->

        <div class="card shadow mt-4">

            <div class="card-header bg-success text-white">

                <h4 class="mb-0">
                    🎒 Emergency Kit
                </h4>

            </div>


            <div class="card-body">


                <!-- WATER -->

                <div class="form-check mb-3">

                    <input
                        class="form-check-input checklist-item"
                        type="checkbox"
                        id="water">

                    <label
                        class="form-check-label"
                        for="water">

                        💧 Drinking Water

                    </label>

                </div>


                <!-- FOOD -->

                <div class="form-check mb-3">

                    <input
                        class="form-check-input checklist-item"
                        type="checkbox"
                        id="food">

                    <label
                        class="form-check-label"
                        for="food">

                        🍱 Non-perishable Food

                    </label>

                </div>


                <!-- FLASHLIGHT -->

                <div class="form-check mb-3">

                    <input
                        class="form-check-input checklist-item"
                        type="checkbox"
                        id="torch">

                    <label
                        class="form-check-label"
                        for="torch">

                        🔦 Flashlight

                    </label>

                </div>


                <!-- FIRST AID -->

                <div class="form-check mb-3">

                    <input
                        class="form-check-input checklist-item"
                        type="checkbox"
                        id="firstaid">

                    <label
                        class="form-check-label"
                        for="firstaid">

                        🩹 First Aid Kit

                    </label>

                </div>


                <!-- POWER BANK -->

                <div class="form-check mb-3">

                    <input
                        class="form-check-input checklist-item"
                        type="checkbox"
                        id="charger">

                    <label
                        class="form-check-label"
                        for="charger">

                        🔋 Mobile Charger / Power Bank

                    </label>

                </div>


                <!-- WHISTLE -->

                <div class="form-check mb-3">

                    <input
                        class="form-check-input checklist-item"
                        type="checkbox"
                        id="whistle">

                    <label
                        class="form-check-label"
                        for="whistle">

                        📣 Emergency Whistle

                    </label>

                </div>


                <!-- DOCUMENTS -->

                <div class="form-check mb-3">

                    <input
                        class="form-check-input checklist-item"
                        type="checkbox"
                        id="documents">

                    <label
                        class="form-check-label"
                        for="documents">

                        📄 Important Documents

                    </label>

                </div>


                <!-- MEDICINE -->

                <div class="form-check mb-3">

                    <input
                        class="form-check-input checklist-item"
                        type="checkbox"
                        id="medicine">

                    <label
                        class="form-check-label"
                        for="medicine">

                        💊 Required Medicines

                    </label>

                </div>


                <!-- RADIO -->

                <div class="form-check mb-3">

                    <input
                        class="form-check-input checklist-item"
                        type="checkbox"
                        id="radio">

                    <label
                        class="form-check-label"
                        for="radio">

                        📻 Emergency Radio

                    </label>

                </div>


                <!-- CLOTHES -->

                <div class="form-check mb-4">

                    <input
                        class="form-check-input checklist-item"
                        type="checkbox"
                        id="clothes">

                    <label
                        class="form-check-label"
                        for="clothes">

                        👕 Extra Clothes

                    </label>

                </div>


                <!-- ================= PROGRESS ================= -->

                <h6 class="text-center">
                    📊 Checklist Progress
                </h6>


                <div class="progress mt-3"
                     style="height: 30px;">

                    <div
                        id="progressBar"
                        class="progress-bar bg-success"
                        role="progressbar"
                        style="width: 0%;">

                        0%

                    </div>

                </div>


                <p
                    id="status"
                    class="text-center mt-3">

                    0 of 10 items completed

                </p>


            </div>

        </div>


        <!-- ================= BUTTONS ================= -->

        <div class="text-center mt-4 mb-5">

            <button
                type="button"
                onclick="checkProgress()"
                class="btn btn-success btn-lg">

                ✅ Check Progress

            </button>


            <button
                type="button"
                onclick="resetChecklist()"
                class="btn btn-danger btn-lg ms-2">

                🔄 Reset Checklist

            </button>


            <a
                href="/"
                class="btn btn-secondary btn-lg ms-2">

                ← Back to Home

            </a>

        </div>

    </div>


    <!-- ================= FOOTER ================= -->

    <footer class="bg-dark text-white text-center p-4 mt-5">

        <p class="mb-0">
            © 2026 AI Disaster Survival Assistant
        </p>

        <small>
            Stay Safe • Stay Prepared • Save Lives
        </small>

    </footer>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        /* ================= CHECK PROGRESS ================= */

        function checkProgress() {

            let items =
                document.querySelectorAll(".checklist-item");

            let completed = 0;

            items.forEach(function(item) {

                if (item.checked) {
                    completed++;
                }

            });


            let total = items.length;


            let percentage =
                Math.round((completed / total) * 100);


            /* Progress Bar */

            let progressBar =
                document.getElementById("progressBar");


            progressBar.style.width =
                percentage + "%";


            progressBar.innerHTML =
                percentage + "%";


            /* Status */

            let status =
                document.getElementById("status");


            status.innerHTML =
                completed +
                " of " +
                total +
                " items completed";


            /* 100% Message */

            if (percentage === 100) {

                status.innerHTML =
                    "🎉 Great! Your emergency kit checklist is complete!";


                progressBar.classList.remove(
                    "bg-success"
                );


                progressBar.classList.add(
                    "bg-primary"
                );

            } else {

                progressBar.classList.remove(
                    "bg-primary"
                );


                progressBar.classList.add(
                    "bg-success"
                );

            }


            saveChecklist();

        }


        /* ================= SAVE CHECKLIST ================= */

        function saveChecklist() {

            let items =
                document.querySelectorAll(".checklist-item");


            let checklistData = {};


            items.forEach(function(item) {

                checklistData[item.id] =
                    item.checked;

            });


            localStorage.setItem(
                "disasterChecklist",
                JSON.stringify(checklistData)
            );

        }


        /* ================= LOAD CHECKLIST ================= */

        function loadChecklist() {

            let savedData =
                localStorage.getItem(
                    "disasterChecklist"
                );


            if (savedData === null) {
                return;
            }


            let checklistData =
                JSON.parse(savedData);


            let items =
                document.querySelectorAll(".checklist-item");


            items.forEach(function(item) {

                if (
                    checklistData[item.id]
                    !== undefined
                ) {

                    item.checked =
                        checklistData[item.id];

                }

            });


            checkProgress();

        }


        /* ================= RESET CHECKLIST ================= */

        function resetChecklist() {

            let confirmReset =
                confirm(
                    "Are you sure you want to reset the checklist?"
                );


            if (!confirmReset) {
                return;
            }


            let items =
                document.querySelectorAll(".checklist-item");


            items.forEach(function(item) {

                item.checked = false;

            });


            localStorage.removeItem(
                "disasterChecklist"
            );


            let progressBar =
                document.getElementById("progressBar");


            progressBar.style.width =
                "0%";


            progressBar.innerHTML =
                "0%";


            progressBar.classList.remove(
                "bg-primary"
            );


            progressBar.classList.add(
                "bg-success"
            );


            document.getElementById("status").innerHTML =
                "0 of 10 items completed";

        }


        /* ================= AUTOMATIC PROGRESS ================= */

        document
            .querySelectorAll(".checklist-item")
            .forEach(function(item) {

                item.addEventListener(
                    "change",
                    function() {

                        checkProgress();

                    }
                );

            });


        /* ================= LOAD SAVED DATA ================= */

        window.onload = function() {

            loadChecklist();

        };

    </script>

</body>

</html>
