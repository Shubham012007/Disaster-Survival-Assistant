<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>AI Emergency Chatbot</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            🚨 Disaster Survival Assistant
        </a>

        <a href="/" class="btn btn-outline-light">
            Home
        </a>

    </div>

</nav>


<!-- ================= CHATBOT ================= -->

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow">

                <!-- HEADER -->

                <div class="card-header bg-primary text-white text-center">

                    <h3 class="mb-0">
                        🤖 AI Emergency Chatbot
                    </h3>

                    <small>
                        Ask about disaster safety
                    </small>

                </div>


                <!-- CHAT AREA -->

                <div
                    id="chatBox"
                    class="card-body"
                    style="height:400px; overflow-y:auto;">

                    <div class="alert alert-info">

                        🤖 Hello! I am your Disaster Survival Assistant.

                        <br><br>

                        You can ask me about:

                        <ul class="mb-0">

                            <li>🌊 Flood</li>

                            <li>🌍 Earthquake</li>

                            <li>🔥 Fire</li>

                            <li>🌀 Cyclone</li>

                            <li>🌧️ Heavy Rain</li>

                            <li>🚨 Emergency</li>

                            <li>🎒 Emergency Kit</li>

                        </ul>

                    </div>

                </div>


                <!-- INPUT -->

                <div class="card-footer">

                    <div class="input-group">

                        <input
                            type="text"
                            id="userInput"
                            class="form-control"
                            placeholder="Type your emergency question..."
                            onkeypress="handleEnter(event)">

                        <button
                            onclick="sendMessage()"
                            class="btn btn-primary">

                            Send

                        </button>

                    </div>

                </div>

            </div>


            <!-- ================= QUICK QUESTIONS ================= -->

            <div class="text-center mt-4">

                <h5>
                    Quick Questions
                </h5>


                <!-- FLOOD -->

                <button
                    onclick="quickMessage('What should I do during a flood?')"
                    class="btn btn-outline-primary m-1">

                    🌊 Flood

                </button>


                <!-- EARTHQUAKE -->

                <button
                    onclick="quickMessage('What should I do during an earthquake?')"
                    class="btn btn-outline-warning m-1">

                    🌍 Earthquake

                </button>


                <!-- FIRE -->

                <button
                    onclick="quickMessage('What should I do during a fire?')"
                    class="btn btn-outline-danger m-1">

                    🔥 Fire

                </button>


                <!-- CYCLONE -->

                <button
                    onclick="quickMessage('What should I do during a cyclone?')"
                    class="btn btn-outline-info m-1">

                    🌀 Cyclone

                </button>


                <!-- HEAVY RAIN -->

                <button
                    onclick="quickMessage('What should I do during heavy rain?')"
                    class="btn btn-outline-primary m-1">

                    🌧️ Heavy Rain

                </button>


                <!-- EMERGENCY -->

                <button
                    onclick="quickMessage('I need emergency help')"
                    class="btn btn-outline-danger m-1">

                    🚨 Emergency

                </button>


                <!-- EMERGENCY KIT -->

                <button
                    onclick="quickMessage('What should I carry in an emergency?')"
                    class="btn btn-outline-success m-1">

                    🎒 Emergency Kit

                </button>

            </div>


            <!-- BACK BUTTON -->

            <div class="text-center mt-4 mb-5">

                <a
                    href="/"
                    class="btn btn-secondary">

                    ← Back to Home

                </a>

            </div>

        </div>

    </div>

</div>


<!-- ================= JAVASCRIPT ================= -->

<script>

/* ================= SEND MESSAGE ================= */

function sendMessage() {

    let input =
        document.getElementById("userInput");

    let message =
        input.value.trim();


    if (message === "") {

        return;

    }


    addUserMessage(message);


    let response =
        getBotResponse(message);


    setTimeout(function() {

        addBotMessage(response);

    }, 400);


    input.value = "";

}


/* ================= ENTER KEY ================= */

function handleEnter(event) {

    if (event.key === "Enter") {

        sendMessage();

    }

}


/* ================= QUICK MESSAGE ================= */

function quickMessage(message) {

    document.getElementById("userInput").value =
        message;

    sendMessage();

}


/* ================= USER MESSAGE ================= */

function addUserMessage(message) {

    let chatBox =
        document.getElementById("chatBox");


    let div =
        document.createElement("div");


    div.className =
        "alert alert-primary text-end";


    div.innerHTML =
        "👤 <b>You:</b> " + message;


    chatBox.appendChild(div);


    chatBox.scrollTop =
        chatBox.scrollHeight;

}


/* ================= BOT MESSAGE ================= */

function addBotMessage(message) {

    let chatBox =
        document.getElementById("chatBox");


    let div =
        document.createElement("div");


    div.className =
        "alert alert-success";


    div.innerHTML =
        "🤖 <b>AI Assistant:</b><br>" + message;


    chatBox.appendChild(div);


    chatBox.scrollTop =
        chatBox.scrollHeight;

}


/* ================= AI RESPONSE ================= */

function getBotResponse(message) {

    let text =
        message.toLowerCase();


    /* ================= FLOOD ================= */

    if (
        text.includes("flood") ||
        text.includes("water")
    ) {

        return `

        🌊 <b>Flood Safety:</b>

        <br><br>

        1. Move to higher ground.<br>

        2. Do not walk or drive through flood water.<br>

        3. Switch off electricity if it is safe to do so.<br>

        4. Keep drinking water and emergency supplies ready.<br>

        5. Avoid contact with contaminated flood water.<br>

        6. Follow official emergency instructions.<br>

        7. Use Location Assistance to find nearby help.

        `;

    }


    /* ================= EARTHQUAKE ================= */

    if (
        text.includes("earthquake") ||
        text.includes("earth quake")
    ) {

        return `

        🌍 <b>Earthquake Safety:</b>

        <br><br>

        1. Drop, Cover and Hold On.<br>

        2. Stay away from windows and glass.<br>

        3. Do not use elevators.<br>

        4. If outside, move away from buildings and power lines.<br>

        5. Protect your head and neck.<br>

        6. After shaking stops, check for injuries and hazards.

        `;

    }


    /* ================= FIRE ================= */

    if (
        text.includes("fire") ||
        text.includes("burn")
    ) {

        return `

        🔥 <b>Fire Safety:</b>

        <br><br>

        1. Stay calm and leave the building quickly.<br>

        2. Use stairs instead of elevators.<br>

        3. Stay low if there is smoke.<br>

        4. Do not go back inside a burning building.<br>

        5. Call emergency services.<br>

        6. If clothes catch fire, stop, drop and roll.<br>

        7. Use Nearby Fire Stations from Location Assistance.

        `;

    }


    /* ================= CYCLONE ================= */

    if (
        text.includes("cyclone") ||
        text.includes("storm")
    ) {

        return `

        🌀 <b>Cyclone Safety:</b>

        <br><br>

        1. Stay indoors and away from windows.<br>

        2. Keep emergency supplies ready.<br>

        3. Charge your phone and power bank.<br>

        4. Secure loose objects around your home if safe.<br>

        5. Follow official warnings and evacuation instructions.<br>

        6. Do not go outside during the storm.

        `;

    }


    /* ================= HEAVY RAIN ================= */

    if (
        text.includes("heavy rain") ||
        text.includes("heavy rainfall") ||
        text.includes("rain")
    ) {

        return `

        🌧️ <b>Heavy Rain Safety:</b>

        <br><br>

        1. Stay indoors and avoid unnecessary travel.<br>

        2. Avoid low-lying and waterlogged areas.<br>

        3. Do not walk or drive through flooded roads.<br>

        4. Keep your mobile phone and power bank charged.<br>

        5. Keep drinking water and emergency supplies ready.<br>

        6. Follow official weather and emergency alerts.<br>

        7. Use Location Assistance to find nearby hospitals and shelters.

        `;

    }


    /* ================= EMERGENCY KIT ================= */

    if (
        text.includes("emergency kit") ||
        text.includes("survival kit") ||
        text.includes("what should i carry") ||
        text.includes("emergency supplies") ||
        text.includes("emergency bag")
    ) {

        return `

        🎒 <b>Emergency Kit:</b>

        <br><br>

        1. 💧 Drinking water<br>

        2. 🥫 Ready-to-eat food<br>

        3. 🔦 Flashlight<br>

        4. 🔋 Extra batteries / power bank<br>

        5. 🩹 First-aid kit<br>

        6. 💊 Necessary medicines<br>

        7. 📱 Fully charged mobile phone<br>

        8. 📻 Emergency radio if available<br>

        9. 🪪 Important documents<br>

        10. 🧥 Basic clothes and blanket<br>

        11. 😷 Masks and basic hygiene items<br>

        12. 💰 Some emergency cash

        <br><br>

        Keep your emergency kit in an easily accessible place.

        `;

    }


    /* ================= EMERGENCY ================= */

    if (
        text.includes("help") ||
        text.includes("emergency") ||
        text.includes("danger") ||
        text.includes("urgent")
    ) {

        return `

        🚨 <b>Emergency Help:</b>

        <br><br>

        If you are in immediate danger, contact local emergency services.

        <br><br>

        📞 Emergency: 112<br>

        🚑 Ambulance: 108<br>

        🚒 Fire Brigade: 101

        <br><br>

        You can also use the Location Assistance feature to find nearby:

        <br>

        🏥 Hospitals<br>

        👮 Police Stations<br>

        🚒 Fire Stations<br>

        🏠 Emergency Shelters

        `;

    }


    /* ================= HELLO ================= */

    if (
        text.includes("hello") ||
        text.includes("hi") ||
        text.includes("hey")
    ) {

        return `

        👋 <b>Hello!</b>

        <br><br>

        I can help you with disaster safety information.

        <br><br>

        Try asking:

        <br><br>

        • What should I do during a flood?<br>

        • What should I do during an earthquake?<br>

        • What should I do during a fire?<br>

        • What should I do during a cyclone?<br>

        • What should I do during heavy rain?<br>

        • What should I carry in an emergency?

        `;

    }


    /* ================= THANK YOU ================= */

    if (
        text.includes("thank you") ||
        text.includes("thanks")
    ) {

        return `

        😊 <b>You're welcome!</b>

        <br><br>

        Stay safe and follow official emergency instructions.

        `;

    }


    /* ================= DEFAULT ================= */

    return `

    🤖 <b>I can currently help with:</b>

    <br><br>

    🌊 Flood<br>

    🌍 Earthquake<br>

    🔥 Fire<br>

    🌀 Cyclone<br>

    🌧️ Heavy Rain<br>

    🚨 Emergency Help<br>

    🎒 Emergency Kit

    <br><br>

    Please ask a question related to one of these situations.

    `;

}

</script>


</body>

</html>
