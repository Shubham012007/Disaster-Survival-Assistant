<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - AI Disaster Survival Assistant</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-light">


<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">


                <!-- HEADER -->

                <div class="card-header bg-danger text-white text-center">

                    <h3>
                        Create Account
                    </h3>

                </div>


                <!-- BODY -->

                <div class="card-body">


                    <form action="/register"
                          method="post">


                        <!-- FULL NAME -->

                        <div class="mb-3">

                            <label class="form-label">
                                Full Name
                            </label>

                            <input
                                type="text"
                                name="fullName"
                                class="form-control"
                                placeholder="Enter your name"
                                required>

                        </div>


                        <!-- EMAIL -->

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                placeholder="Enter your email"
                                required>

                        </div>


                        <!-- PASSWORD -->

                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Create password"
                                required>

                        </div>


                        <!-- CONFIRM PASSWORD -->

                        <div class="mb-3">

                            <label class="form-label">
                                Confirm Password
                            </label>

                            <input
                                type="password"
                                name="confirmPassword"
                                class="form-control"
                                placeholder="Confirm password"
                                required>

                        </div>


                        <!-- REGISTER BUTTON -->

                        <button
                            type="submit"
                            class="btn btn-danger w-100">

                            Register

                        </button>


                    </form>


                    <!-- LOGIN -->

                    <div class="text-center mt-3">

                        Already have an account?

                        <a href="/login">
                            Login
                        </a>

                    </div>


                </div>

            </div>

        </div>

    </div>

</div>


</body>

</html>
